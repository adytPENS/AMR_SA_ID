wheel_odometry:
  ros__parameters:
    use_sim_time: false
    sensor: "titan0"
    track_width: 0.35
    publish_rate: 30.0
    max_encoder_delta: 0.25
    odom_frame: "odom"
    base_frame: "base_link"
    use_imu_yaw: true
    imu_topic: "/imu"
    max_imu_delta: 0.50
    # navX bertambah negatif saat robot berputar kiri; ROS memakai CCW positif.
    imu_yaw_sign: -1.0
