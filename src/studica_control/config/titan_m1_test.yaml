control_server:
  ros__parameters:
    use_sim_time: false

    # navX onboard VMX2. Aktifkan di proses yang sama dengan Titan agar hanya
    # satu control_server yang mengakses hardware VMX.
    imu:
      enabled: true
      name: "imu"
      topic: "imu"
      frame_id: "imu_link"

    # Light tower dikendalikan sebagai digital output langsung oleh navigator:
    # C/control=12, red=13, green=14, yellow=15.
    light_tower:
      enabled: false

    # Push START active-low pada DIO 10 dan STOP active-high pada DIO 11.
    dio:
      enabled: true
      sensors: ["start_button", "stop_button", "light_control", "light_red", "light_green", "light_yellow"]
      start_button:
        pin: 10
        type: "input"
        interrupt_edge: "falling"
        debounce_ms: 250
      stop_button:
        pin: 11
        type: "input"
        interrupt_edge: "rising"
        debounce_ms: 250
      light_control:
        pin: 12
        type: "output"
        interrupt_edge: "none"
        debounce_ms: 0
      light_red:
        pin: 13
        type: "output"
        interrupt_edge: "none"
        debounce_ms: 0
      light_green:
        pin: 14
        type: "output"
        interrupt_edge: "none"
        debounce_ms: 0
      light_yellow:
        pin: 15
        type: "output"
        interrupt_edge: "none"
        debounce_ms: 0

    # Satu Titan pada CAN ID 42. Ubah can_id agar sama dengan konfigurasi
    # DIP switch / CAN ID pada Titan yang akan diuji.
    titan:
      enabled: true
      sensors: ["titan0"]
      titan0:
        can_id: 42
        motor_freq: 15600
        encoder_rate_hz: 20
        motor_update_rate_hz: 50
        enable_freshness: true

        # Label fisik Titan sama dengan indeks driver: M1 = m_1.
        # Maverick 50.9:1: 1221.6 count/output-rev; roda diameter 0.12 m.
        # pi * 0.12 / 1221.6 = 0.000308604386 meter per tick.
        m_0:
          encoder_mode: "quadrature"
          dist_per_tick: 0.000308604386
          invert_motor: false
          # Motor kanan memakai duty negatif untuk maju; balik feedback agar
          # jarak maju tetap positif untuk odometri.
          invert_encoder: true
          invert_rpm: false

        m_1:
          encoder_mode: "quadrature"
          dist_per_tick: 0.000308604386
          invert_encoder: true
        m_2:
          encoder_mode: "quadrature"
          dist_per_tick: 0.000308604386
        m_3:
          encoder_mode: "quadrature"
          dist_per_tick: 0.000308604386
