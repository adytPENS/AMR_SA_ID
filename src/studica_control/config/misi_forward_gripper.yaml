# Posisi robot saat tombol START ditekan
start_pose:
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

calibration:
  lift_cm_per_rev: -8.017
  # Kalibrasi manual: encoder 0.02376253780676052 = 0 derajat,
  # encoder 0.4666098332963884 = 180 derajat ke kiri (encoder bertambah).
  # Skala = 180 / (0.4666098332963884 - 0.02376253780676052).
  rotate_deg_per_rev: 406.46065095866857
  lift_positive_duty_sign: -1
  rotate_positive_duty_sign: -1  # Duty negatif = kiri, mengikuti mapping keyboard J.

settings:
  linear_speed_mps: 0.75
  angular_speed_rps: 2
  minimum_angular_speed_rps: 1.2
  front_stop_cm: 8
  rotate_duty_percent: 33.3
  slide_duty_percent: 15

servo_positions:
  wrist:
    "on": left_value
    "off": right_value

  gripper:
    "on": left_value
    "off": right_value

mission:

  - action: light
    color: green
    mode: steady

  - action: forward
    until:
      travel_cm: 120
    speed_mps: 0.30
    timeout_s: 20

