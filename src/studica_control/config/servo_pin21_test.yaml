control_server:
  ros__parameters:
    use_sim_time: false

    # Tes terisolasi servo posisi/standard pada VMX PWM channel 21.
    servo:
      enabled: true
      sensors: ["test_servo"]
      test_servo:
        port: 21
        type: "standard"

    imu:
      enabled: false
    dio:
      enabled: false
    titan:
      enabled: false
    light_tower:
      enabled: false
