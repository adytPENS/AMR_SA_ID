control_server:
  ros__parameters:
    use_sim_time: false

    # Tes terisolasi digital output VMX DIO 8. Jangan jalankan bersamaan
    # dengan titan_m1_test.yaml karena light tower juga memakai pin ini.
    dio:
      enabled: true
      sensors: ["dio"]
      dio:
        pin: 8
        type: "output"
        interrupt_edge: "none"
        debounce_ms: 0

    imu:
      enabled: false
    titan:
      enabled: false
    light_tower:
      enabled: false
