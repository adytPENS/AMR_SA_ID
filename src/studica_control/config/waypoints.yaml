# "map": koordinat A-D dan start_pose diisi dari peta juri. Program otomatis
# mengubahnya menjadi koordinat lokal odometri. Gunakan "local" jika titik
# sudah dihitung relatif terhadap start robot.
coordinate_mode: local

# Pose robot ketika tombol start ditekan, dalam frame peta juri.
# yaw_deg=0 berarti depan robot sejajar sumbu +X peta.
start_pose: {x: 0.00, y: 0.00, yaw_deg: 0.0}

# Koordinat titik dalam meter pada frame peta juri.
waypoints:
  A: {x: 1.00, y: 0.00}
  B: {x: 1.00, y: 1.00}
  C: {x: 0.00, y: 1.00}
  D: {x: 0.00, y: 0.00}

# Urutan dapat diubah di sini atau melalui --sequence A,B,D,C.
sequence: [A, B, C, D]

# Aktifkan setelah tombol dipasang pada VMX DIO dan start_button diaktifkan
# pada titan_m1_test.yaml. Manual start service tetap dapat digunakan.
start_button:
  enabled: true
  topic: "/start_button/state"
  active_high: false
  debounce_ms: 250

motion:
  linear_speed: 0.35
  minimum_linear_speed: 0.10
  angular_speed: 1.20
  heading_kp: 1.50
  distance_kp: 0.80
  max_heading_correction: 0.60
  position_tolerance: 0.12
  turn_tolerance_deg: 6.0
  drive_heading_limit_deg: 25.0

obstacle_avoidance:
  enabled: true
  stop_distance: 0.55
  clear_distance: 0.75
  avoid_angle_deg: 55.0
  avoid_step_distance: 0.60
  timeout: 12.0
